<button class="desktop-shortcut" type="button" (click)="showWindow(windowId)">
  <div class="icon-wrapper">
    <span style="font-size: 2.75rem;"><img src={{picture}} width="50px" alt="{{emoji}}"></span>
    <ng-content select="icon-visual"></ng-content>
  </div>
  <span class="icon-label">
    <ng-content select="icon-text">{{name}}</ng-content>
  </span>
</button>
