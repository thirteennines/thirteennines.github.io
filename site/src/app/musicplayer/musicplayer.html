<window (close)="close()" (animationFinished)="animationDone()" [isClosing]="isClosing" class="window size"> 
  <windowtitle> 
     <img src="mix.gif" class="mix-gif" alt="cd gif">
     mixtapes
  </windowtitle>
  
  <windowcontent>
      
    <div class="win95-player">
      <div class="display-panel">
        <div class="metadata-readout">
          <div class="scrolling-ticker">
             <marquee 
            #playerMarquee
            behavior="scroll" 
            direction="left" 
            scrollamount="3"
            (mouseenter)="playerMarquee.stop()"
            (mouseleave)="audio && !audio.paused ? playerMarquee.start() : null">
            {{ currentMusic.artist }} - {{ currentMusic.title }} [{{ currentMixtape.name }}]
          </marquee>
          </div>
          <div class="time-readout" style="text-align: center; display: flex; justify-content: center;">
            <p style="text-align: center;">
            <span class="digital-clock" style="text-align: center;">{{ currentTime }}</span>
            <span class="divider" style="text-align: center;">/</span>
            <span class="total-duration" style="text-align: center;">{{ musicLength }}</span></p>
          </div>
          <div class="slider-row timeline-row">
          <label></label>
          <input
            type="range"
            class="win95-slider"
            [min]="0"
            [max]="duration"
            [value]="currentTimeValue"
            (input)="durationSlider($event)"
            step="0.1"
          />
        </div>
        </div>
      </div>

      <div class="sliders-deck">
        <div class="slider-row volume-row">
          <label>🔊</label>
          <input
            type="range"
            class="win95-slider"
            min="0"
            max="16"
            [value]="volumeValue"
            (input)="volumeSlider($event)"
          />
        </div>
      </div>

      <div class="media-buttons">
        <button class="win95-btn" (click)="prev()" title="Previous Track">
          <img src="skip_back.gif">
        </button>
        <button class="win95-btn play-btn" (click)="play()" title="Play / Pause">
          <span *ngIf="audio?.paused"><img src="play.gif"></span>
          <span *ngIf="!audio?.paused"><img src="pause.gif"></span>
        </button>
        <button class="win95-btn" (click)="next()" title="Next Track">
          <img src="skip_forwards.gif">
        </button>
      </div>

      <div class="tape-deck-selector">
        <label for="tape-dropdown">mixtape:</label>
        <select id="tape-dropdown" class="win95-select" (change)="selectMixtape($event)">
          <option *ngFor="let tape of mixtapes" [value]="tape.id">
            {{ tape.name }}
          </option>
        </select>
      </div>

      <div class="playlist-window">
        <div class="playlist-header">Track List Directory</div>
        <ul class="playlist-tracks">
          <li 
            *ngFor="let track of currentMixtape.tracks; let i = index" 
            [class.track-active]="i === trackPointer"
            (click)="play(i)">
            <span class="track-num">{{ (i + 1) | number:'2.0-0' }}</span>
            <span class="track-title-text">{{ track.artist }} - {{ track.title }}</span>
            <span class="live-wave" *ngIf="i === trackPointer && !audio?.paused">🔊</span>
          </li>
        </ul>
      </div>

    </div>
  </windowcontent>
</window>
